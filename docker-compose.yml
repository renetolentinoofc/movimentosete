services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: movimento7
      POSTGRES_USER: movimento7
      POSTGRES_PASSWORD: movimento7-local
    ports:
      - "54327:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movimento7 -d movimento7"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - movimento7_postgres:/var/lib/postgresql

volumes:
  movimento7_postgres:
