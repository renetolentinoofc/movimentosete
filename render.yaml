previews:
  generation: manual

databases:
  - name: movimento7-db
    databaseName: movimento7
    user: movimento7
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: movimento7-api
    runtime: python
    plan: starter
    region: ohio
    buildCommand: pip install -e apps/api
    preDeployCommand: PYTHONPATH=apps/api FLASK_APP=wsgi:app flask db upgrade
    initialDeployHook: PYTHONPATH=apps/api FLASK_APP=wsgi:app flask seed
    startCommand: gunicorn --chdir apps/api --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/v1/health/live
    buildFilter:
      paths:
        - apps/api/**
        - migrations/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movimento7-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.1.0
      - key: DEPLOYED_AT
        sync: false
      - key: GIT_COMMIT
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://movimento7.com.br
      - key: CORS_ORIGINS
        value: https://movimento7.com.br
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AUCTION_BIDDING_ENABLED
        value: "false"
      - key: PAYMENT_PROVIDER
        value: manual
      - key: SHIPPING_METHOD
        value: manual
      - key: SHIPPING_LABEL
        value: Entrega padrão
      - key: SHIPPING_FLAT_RATE_CENTS
        value: "0"
      - key: SHIPPING_FREE_THRESHOLD_CENTS
        value: "0"
      - key: SHIPPING_ESTIMATED_DAYS
        value: "0"
      - key: EMAIL_DELIVERY_MODE
        value: log
      - key: EMAIL_SANDBOX_RECIPIENT
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: Movimento 7
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_CONTACT_RECIPIENT
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: PASSWORD_RESET_MINUTES
        value: "30"
      - key: MEDIA_PROVIDER
        value: google_drive
      - key: INITIAL_ADMIN_EMAIL
        value: admin@movimento7.com
      - key: INITIAL_ADMIN_NAME
        value: Administrador Movimento 7
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: MEDIA_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_DRIVE_PRODUCT_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_GALLERY_FOLDER_ID
        sync: false
      - key: ERROR_REPORTING_DSN
        sync: false
  - type: cron
    name: movimento7-gallery-reconcile
    runtime: python
    plan: starter
    region: ohio
    schedule: "0 */6 * * *"
    buildCommand: pip install -e apps/api
    startCommand: PYTHONPATH=apps/api FLASK_APP=wsgi:app flask reconcile-gallery --limit 500
    buildFilter:
      paths:
        - apps/api/**
        - migrations/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movimento7-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://movimento7.com.br
      - key: MEDIA_PROVIDER
        value: google_drive
      - key: MEDIA_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_PRODUCT_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_GALLERY_FOLDER_ID
        sync: false
      - key: ERROR_REPORTING_DSN
        sync: false
  - type: cron
    name: movimento7-expire-inventory
    runtime: python
    plan: starter
    region: ohio
    schedule: "*/10 * * * *"
    buildCommand: pip install -e apps/api
    startCommand: PYTHONPATH=apps/api FLASK_APP=wsgi:app flask expire-inventory-reservations --limit 500
    buildFilter:
      paths:
        - apps/api/**
        - migrations/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movimento7-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://movimento7.com.br
