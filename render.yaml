services:
  - type: web
    name: movimento7
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --workers 1 --threads 4 --timeout 120
    healthCheckPath: /saude

    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_REFRESH_TOKEN
        sync: false

      - key: GOOGLE_DRIVE_GALLERY_FOLDER_ID
        sync: false

      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_PASSWORD
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: movimento7-db
          property: connectionString

databases:
  - name: movimento7-db
    plan: free
    databaseName: movimento7
    user: movimento7
