services:
  - type: web
    name: movimento7
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --workers 2 --threads 4 --timeout 120
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: movimento7-db
          property: connectionString

databases:
  - name: movimento7-db
    plan: free
    databaseName: movimento7
    user: movimento7
