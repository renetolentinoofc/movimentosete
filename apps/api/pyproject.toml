[project]
name = "movimento7-api"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "Flask==3.1.3",
  "Flask-Cors==6.0.1",
  "Flask-Migrate==4.1.0",
  "Flask-SQLAlchemy==3.1.1",
  "SQLAlchemy==2.0.52",
  "alembic==1.16.5",
  "cryptography==50.0.0",
  "gunicorn==26.0.0",
  "Pillow==12.3.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "sentry-sdk[flask]==2.35.0"
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==6.3.0",
  "ruff==0.12.12"
]

[tool.setuptools.packages.find]
include = ["movimento7*"]

[tool.pytest.ini_options]
testpaths = ["../../tests/api"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
