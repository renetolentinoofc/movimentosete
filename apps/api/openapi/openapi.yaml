        '422': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]+$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 100 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  schemas:
    Envelope:
      type: object
      required: [data, meta, error, request_id]
      properties:
        data: {}
        meta: { type: object, additionalProperties: true }
        error:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/ApiError' }]
        request_id: { type: [string, 'null'] }
    ApiError:
      type: object
      required: [code, message, fields]
      properties:
        code: { type: string }
        message: { type: string }
        fields:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    RegistrationInput:
      type: object
      required: [full_name, email, phone, city, category, presentation, privacy_accepted, privacy_version]
      properties:
        full_name: { type: string, maxLength: 140 }
        professional_name: { type: string, maxLength: 140 }
        email: { type: string, format: email, maxLength: 180 }
        phone: { type: string }
        instagram: { type: string }
        city: { type: string, maxLength: 120 }
        category: { type: string }
        presentation: { type: string, maxLength: 3000 }
        portfolio_url: { type: string, format: uri }
        privacy_accepted: { type: boolean, const: true }
        privacy_version: { type: string }
        fax_number_for_bots: { type: string, description: Honeypot; deve permanecer vazio. }
    ContactInput:
      type: object
      required: [name, email, subject, message, privacy_accepted, privacy_version]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        subject: { type: string }
        message: { type: string }
        privacy_accepted: { type: boolean, const: true }
        privacy_version: { type: string }
        fax_number_for_bots: { type: string, description: Honeypot; deve permanecer vazio. }
    CartItemInput:
      type: object
      required: [cart_token, variant_id, quantity]
      properties:
        cart_token: { type: string }
        variant_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 0, maximum: 10 }
    AdminProfileInput:
      type: object
      properties:
        display_name: { type: string, minLength: 2, maxLength: 140 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 180 }
        bio: { type: string, maxLength: 5000 }
        city: { type: [string, 'null'], maxLength: 120 }
        instagram: { type: [string, 'null'], maxLength: 30 }
        featured: { type: boolean }
        category_ids:
          type: array
          items: { type: string, format: uuid }
    AdminProfileAssetInput:
      type: object
      properties:
        alt_text: { type: string, maxLength: 180 }
        credit: { type: [string, 'null'], maxLength: 180 }
        display_order: { type: integer, minimum: 0 }
        active: { type: boolean }
    AdminEmailTestInput:
      type: object
      required: [idempotency_key]
      properties:
        recipient: { type: string, format: email, maxLength: 180 }
        idempotency_key: { type: string, minLength: 8, maxLength: 100 }
    AdminAuctionLotInput:
      type: object
      required: [title, artist_name, starting_bid_cents, minimum_increment_cents]
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        slug: { type: string, maxLength: 160 }
        artist_name: { type: string, minLength: 1, maxLength: 140 }
        starting_bid_cents: { type: integer, minimum: 0 }
        minimum_increment_cents: { type: integer, minimum: 1 }
        technique: { type: string, maxLength: 140 }
        dimensions: { type: string, maxLength: 120 }
        description: { type: string }
        rules: { type: string }
    AdminUserInput:
      type: object
      required: [email, name, password, roles]
      properties:
        email: { type: string, format: email, maxLength: 180 }
        name: { type: string, minLength: 1, maxLength: 140 }
        password: { type: string, format: password, minLength: 12 }
        roles:
          type: array
          items: { type: string }
    AdminGalleryAlbumInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 2, maxLength: 180 }
        slug: { type: string, maxLength: 160 }
        description: { type: string }
    AdminGalleryMediaUpload:
      type: object
      required: [file, title, category, alt_text]
      properties:
        file: { type: string, format: binary }
        title: { type: string, maxLength: 180 }
        category: { type: string, maxLength: 60 }
        alt_text: { type: string, maxLength: 180 }
        caption: { type: string, maxLength: 600 }
        credit: { type: string, maxLength: 180 }
    AdminContactTriageInput:
      type: object
      properties:
        status: { type: string, enum: [received, in_progress, resolved, archived] }
        assigned_to_id: { type: [string, 'null'], format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AdminContactNoteInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 3, maxLength: 2000 }
    AdminContactReplyInput:
      type: object
      required: [subject, message, idempotency_key]
      properties:
        subject: { type: string, minLength: 3, maxLength: 180 }
        message: { type: string, minLength: 3, maxLength: 5000 }
        idempotency_key: { type: string, minLength: 8, maxLength: 100 }
    AdminEditionInput:
      type: object
      required: [name, slug, starts_at, ends_at, registration_opens_at, registration_closes_at]
      properties:
        name: { type: string, minLength: 2, maxLength: 140 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 5000 }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        registration_opens_at: { type: [string, 'null'], format: date-time }
        registration_closes_at: { type: [string, 'null'], format: date-time }
        location: { type: [string, 'null'], maxLength: 180 }
        address: { type: [string, 'null'], maxLength: 300 }
        map_url: { type: [string, 'null'], format: uri }
        capacity: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
        retention_days: { type: integer, minimum: 30, maximum: 3650 }
  responses:
    Success:
      description: Resposta bem-sucedida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error:
      description: Erro esperado e seguro
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
